name: 不具合の報告 / Bug report
description: うまく動かないときの報告 / Something isn't working
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **API キー・ACCESS_KEY・Notion のトークン・個人情報は書かないでください。** スクリーンショットやログも、workers.dev の URL や Notion の内容を必要に応じて隠してください。
        **Do not include API keys, ACCESS_KEY, Notion tokens or personal information.** Redact screenshots and logs (workers.dev URL, Notion content) as needed.
  - type: textarea
    id: what
    attributes:
      label: 何が起きたか / What happened
      description: 画面に出たメッセージがあれば、そのまま書いてください / Include any message shown on screen
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 再現の手順 / Steps to reproduce
      placeholder: |
        1. 
        2. 
        3. 
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期待した動き / Expected behavior
  - type: input
    id: version
    attributes:
      label: バージョン / Version
      placeholder: v1.0.0
  - type: input
    id: device
    attributes:
      label: 端末とブラウザ / Device and browser
      placeholder: iPhone 16 / iOS 26 / Safari
  - type: dropdown
    id: deploy
    attributes:
      label: 公開のしかた / How you deployed
      options:
        - Deploy to Cloudflare ボタン / button
        - wrangler コマンド / CLI
        - ローカル（node server.mjs）/ Local
  - type: checkboxes
    id: secrets
    attributes:
      label: 確認 / Check
      options:
        - label: API キー・ACCESS_KEY・Notion のトークン・個人情報を含めていません / I removed API keys, ACCESS_KEY, Notion tokens and personal information
          required: true
