name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      # 自動テストが読み込まない画面のコード（public/app.js など）も、文法の誤りがないか確かめる
      - run: for f in public/*.js lib/*.js worker.js server.mjs; do node --check "$f"; done
      - run: npm test

  # 対応する最小の Node.js（package.json の engines）でも動くことを確かめる
  test-min-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 20
      - run: npm test
